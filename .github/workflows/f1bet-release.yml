name: F1Bet Offline Release Gates

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'f1bet/**'
      - 'tests/**'
      - 'scripts/validate_workflow_security.py'
      - 'scripts/scan_embedded_secrets.py'
      - 'scripts/smoke_streamlit_app.py'
      - 'raceAnalysis.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'f1bet/**'
      - 'tests/**'
      - 'scripts/validate_workflow_security.py'
      - 'scripts/scan_embedded_secrets.py'
      - 'scripts/smoke_streamlit_app.py'
      - 'raceAnalysis.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  offline-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install offline test dependencies
        run: python -m pip install pytest pandas numpy scipy scikit-learn requests pyyaml
      - name: Run offline unit suite
        run: python -m pytest -q
      - name: Compile all Python modules
        run: python -Wall -m compileall -q .
      - name: Validate workflow hardening
        run: python scripts/validate_workflow_security.py
      - name: Scan for embedded credentials
        run: python scripts/scan_embedded_secrets.py
      - name: Exercise CLI
        run: python -m f1bet --help

  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise the real Streamlit entrypoint
        run: python scripts/smoke_streamlit_app.py
