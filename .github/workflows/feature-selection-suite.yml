name: Feature Selection Suite

permissions:
  contents: read

concurrency:
  group: f1-generated-artifact-writes
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * 3-11 sun'  # Mar-Nov (EDT): Sundays at 5 AM UTC
    - cron: '0 5 * 12,1,2 sun'  # Dec-Feb (EST): Sundays at 5 AM UTC

jobs:
  rfe-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run RFE
        run: python scripts/precompute/rfe_features.py --output data_files/precomputed/rfe_results.json
        env:
          STREAMLIT_SERVER_HEADLESS: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rfe-results
          path: data_files/precomputed/rfe_results.json

  boruta-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Boruta
        run: python scripts/precompute/boruta_features.py --max-iter 200 --output data_files/precomputed/boruta_results.json
        env:
          STREAMLIT_SERVER_HEADLESS: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: boruta-results
          path: data_files/precomputed/boruta_results.json

  shap-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run SHAP Analysis
        run: python scripts/precompute/shap_analysis.py --output data_files/precomputed/shap_results.json
        env:
          STREAMLIT_SERVER_HEADLESS: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shap-results
          path: data_files/precomputed/shap_results.json

  permutation-importance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Permutation Importance
        run: python scripts/precompute/permutation_importance.py --output data_files/precomputed/permutation_results.json
        env:
          STREAMLIT_SERVER_HEADLESS: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: permutation-results
          path: data_files/precomputed/permutation_results.json

  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Historical Validation
        run: python scripts/precompute/historical_validation.py --output data_files/precomputed/historical_validation.json
        env:
          STREAMLIT_SERVER_HEADLESS: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: historical-validation-results
          path: data_files/precomputed/historical_validation.json

  commit-all:
    needs: [rfe-selection, boruta-selection, shap-analysis, permutation-importance, historical-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*-results'
          path: data_files/precomputed/
          merge-multiple: true
      - name: Show git status at start
        run: |
          echo "Job started at $(date -u)"
          git status
          git log -1 --oneline
          git pull --ff-only origin main || true
      - name: Commit feature selection results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --ff-only origin main || true
          git add data_files/precomputed/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update feature selection results [skip ci]"
            git push
          fi
      - name: Show post-push status
        if: success()
        run: |
          echo "Job finished at $(date -u)"
          git log -1 --oneline
          git remote show origin | grep "HEAD branch" -A1
