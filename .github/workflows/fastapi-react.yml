name: FastAPI + React parity checks

permissions:
  contents: read

concurrency:
  group: fastapi-react-parity-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "fastapi_react/**"
      - ".github/workflows/fastapi-react.yml"
  push:
    branches: [main, "design/fastapi-react"]
    paths:
      - "fastapi_react/**"
  workflow_dispatch:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi_react/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fastapi_react/backend/requirements.txt
            fastapi_react/backend/requirements-dev.txt
      - name: Install runtime + dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy (strict)
        run: python -m mypy --explicit-package-bases app
      - name: Pytest with coverage (>=80%)
        run: python -m pytest
      - name: pip-audit
        run: python -m pip_audit -r requirements.txt
        continue-on-error: true  # known dev-dep advisories; see PARITY_REPORT.md

  frontend:
    name: Frontend (eslint, tsc, vitest, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi_react/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastapi_react/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Vitest with coverage
        run: npm test
      - name: Build (bundle size budget)
        run: npx vite build
      - name: Production-deps audit
        run: npm run audit
        continue-on-error: true  # dev-dep advisories only; see PARITY_REPORT.md


  visual-parity:
    name: Visual parity evidence
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi_react/backend/requirements.txt
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastapi_react/frontend/package-lock.json
      - name: Install backend
        working-directory: fastapi_react/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Streamlit reference runtime
        run: pip install -r requirements-web.txt
      - name: Install frontend and browser
        working-directory: fastapi_react/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start parity stack
        env:
          F1_REPO_ROOT: ${{ github.workspace }}
          ENABLE_EXPENSIVE_TOOLS: "0"
          F1_RESEARCH_MODE: "0"
          STREAMLIT_SERVER_HEADLESS: "true"
        run: |
          (cd fastapi_react/backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/f1-backend.log 2>&1 & echo $! > /tmp/f1-backend.pid)
          (cd fastapi_react/frontend && npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/f1-frontend.log 2>&1 & echo $! > /tmp/f1-frontend.pid)
          (streamlit run raceAnalysis.py --server.address 127.0.0.1 --server.port 8501 --server.headless true > /tmp/f1-streamlit.log 2>&1 & echo $! > /tmp/f1-streamlit.pid)
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null               && curl -fsS http://127.0.0.1:5173 >/dev/null               && curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/f1-backend.log || true
          cat /tmp/f1-frontend.log || true
          cat /tmp/f1-streamlit.log || true
          exit 1
      - name: Capture React reference
        working-directory: fastapi_react/frontend
        env:
          REACT_BASE_URL: http://127.0.0.1:5173
          REACT_WAIT_MS: "4000"
        run: npm run capture:react
      - name: Accessibility audit
        working-directory: fastapi_react/frontend
        env:
          REACT_BASE_URL: http://127.0.0.1:5173
        run: npm run audit:a11y
      - name: Operational benchmark
        working-directory: fastapi_react/frontend
        env:
          BENCH_BASE_URL: http://127.0.0.1:5173
          BENCH_API_URL: http://127.0.0.1:8000
        run: npm run benchmark
      - name: Capture local Streamlit reference
        working-directory: fastapi_react/frontend
        env:
          STREAMLIT_BASE_URL: http://127.0.0.1:8501
          STREAMLIT_WAIT_MS: "5000"
        run: npm run capture:streamlit
      - name: Diff screenshots
        working-directory: fastapi_react/frontend
        run: npm run capture:diff
      - name: Upload visual parity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fastapi-react-parity-evidence
          path: |
            fastapi_react/parity_evidence/visual
            fastapi_react/parity_evidence/accessibility.json
            fastapi_react/parity_evidence/benchmarks.json
          if-no-files-found: error
