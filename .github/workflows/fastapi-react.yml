name: FastAPI + React parity checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "fastapi_react/**"
      - ".github/workflows/fastapi-react.yml"
  push:
    branches: [main, "design/fastapi-react"]
    paths:
      - "fastapi_react/**"
  workflow_dispatch:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi_react/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@42322d6e0d3f649b1e7b3e90a78fc01f0b93e64f # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fastapi_react/backend/requirements.txt
            fastapi_react/backend/requirements-dev.txt
      - name: Install runtime + dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy (strict)
        run: python -m mypy app
      - name: Pytest with coverage (>=80%)
        run: python -m pytest
      - name: pip-audit
        run: python -m pip_audit -r requirements.txt
        continue-on-error: true  # known dev-dep advisories; see PARITY_REPORT.md

  frontend:
    name: Frontend (eslint, tsc, vitest, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi_react/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1a4442cacd436585916f0c6523cae7e5a38b1c93 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastapi_react/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Vitest with coverage
        run: npm test
      - name: Build (bundle size budget)
        run: npx vite build
      - name: Production-deps audit
        run: npm run audit
        continue-on-error: true  # dev-dep advisories only; see PARITY_REPORT.md
