services:
  backend:
    build:
      context: ..
      dockerfile: fastapi_react/backend/Dockerfile
    environment:
      F1_REPO_ROOT: /repo
      F1_TRUSTED_LOCAL: "0"
      ENABLE_EXPENSIVE_TOOLS: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ..:/repo:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    mem_limit: 1600m

